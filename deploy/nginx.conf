# /etc/nginx/sites-available/creator.conf
# 设定创作器 v6 —— Nginx 生产/测试环境配置
# 支持当前机器无域名直接 IP/端口访问，同时预留后期域名 + Let's Encrypt HTTPS 块

server {
    listen 80;
    server_name _; # 后期绑定域名时改为: server_name your-domain.example.com;

    client_max_body_size 12m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端构建静态目录
    root /var/www/creator;
    index index.html;

    # Vite 指纹静态资源：1 年强缓存
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 用户上传的 256x256 JPEG 头像直出
    location /avatars/ {
        alias /var/lib/creator/avatars/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Go 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA History 路由回退，且 index.html 禁用缓存确保发版即刻生效
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

# =========================================================================
# 后期绑定域名启用 HTTPS 说明：
# 1. 将上方 `server_name _;` 替换为你的域名
# 2. 运行 `sudo apt install -y certbot python3-certbot-nginx`
# 3. 运行 `sudo certbot --nginx -d your-domain.example.com`
# 4. 将 /etc/creator/creator.env 中的 SECURE_COOKIE=false 改为 SECURE_COOKIE=true
# 5. 运行 `sudo systemctl restart creator`
# =========================================================================
