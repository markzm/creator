name = "creator"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "creator-db"
database_id = "c5f7e64b-ea28-4b93-afcb-ca79c40b07f4"
migrations_dir = "./migrations"

# [[r2_buckets]]
# binding = "AVATARS"
# bucket_name = "creator-avatars"

[vars]
REGISTER_MODE = "open"
ALLOWED_AI_HOSTS = "api.deepseek.com,api.siliconflow.cn,openrouter.ai,api.openai.com"

# AI quotas share durable D1 counters; public daily quota resets at Beijing midnight.
AI_PUBLIC_MINUTE = "5"
AI_PUBLIC_DAILY = "50"
AI_CUSTOM_MINUTE = "30"
AI_TIMEOUT_SECONDS = "90"
AI_MAX_INPUT_BYTES = "131072"
AI_MAX_OUTPUT_TOKENS = "4096"

[triggers]
crons = ["15 19 * * *"]
